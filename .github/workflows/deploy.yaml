name: Build and Deploy Pomodoro API

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Package (CI)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install -r requirements.txt --break-system-packages

      - name: Run Unit Tests
        run: |
          python3 -m pytest

      - name: Package API Server
        run: |
          zip -r pomodoro-api.zip . -x "*.git*"

      - name: Publish Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroApi
          path: pomodoro-api.zip

  deploy:
    name: Deploy to WSL Host via SSH
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: PomodoroApi
          path: extracted

      - name: Configure SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H host.docker.internal >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy and Launch on Host via SSH
        run: |
          echo "=== Copying Package to WSL Host ==="
          scp -i ~/.ssh/deploy_key extracted/pomodoro-api.zip samuelnigus@host.docker.internal:/tmp/pomodoro-api.zip

          echo "=== Executing Deployment Commands on WSL Host ==="
          ssh -i ~/.ssh/deploy_key samuelnigus@host.docker.internal << 'EOF'
            set -e
            DEPLOY_DIR=$HOME/deployments/pomodoro-api
            mkdir -p $DEPLOY_DIR
            
            # Extract archive
            unzip -o /tmp/pomodoro-api.zip -d $DEPLOY_DIR
            rm /tmp/pomodoro-api.zip
            
            # Configure Python Venv on Host
            python3 -m venv $DEPLOY_DIR/venv
            source $DEPLOY_DIR/venv/bin/activate
            pip install --upgrade pip
            pip install -r $DEPLOY_DIR/requirements.txt
            
            # Stop Existing Instance on Port 8000
            PID=$(netstat -tlpn 2>/dev/null | grep ":8000 " | awk '{print $7}' | cut -d'/' -f1)
            if [ -n "$PID" ]; then
              echo "Stopping existing process PID: $PID"
              kill -9 $PID || true
            fi
            
            # Start Uvicorn in Background on Host
            cd $DEPLOY_DIR
            nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
            sleep 3
          EOF

      - name: Verify Host Endpoint
        run: |
          echo "=== Running Remote Health Check ==="
          curl --fail --retry 5 http://host.docker.internal:8000/ || exit 1
          echo "API successfully deployed and verified on WSL Host!"