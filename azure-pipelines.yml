trigger:
  - main

pool:
  name: 'Default'

steps:
  - script: |
      python3 -m pip install --upgrade pip
      pip install pyinstaller
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    displayName: 'Install PyInstaller and Project Dependencies'

  - script: |
      pyinstaller --onefile --windowed --name PomodoroTimer app.py
    displayName: 'Build App with PyInstaller'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Compiled Binary'
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/dist'
      artifact: 'PomodoroTimer-App'
      publishLocation: 'pipeline'