# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: windows-latest

stages:
- stage: Build
  displayName: 'Build stage'
  jobs:
  - job: Build
    displayName: 'Build job'
    steps:
    - task: PublishBuildArtifacts@1
      displayName: 'Bundle Pomodoro Files'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)'
        artifact: 'pomodoro-drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy Pomodoro App'
  dependsOn: Build
  jobs:
  - deployment: VMDeploy
    displayName: 'Deploy to VMware VM'
    environment:
      name: 'Windows Server'                  # Matches the Environment name you created
      resourceType: virtualMachine     # Tells Azure to deploy to your registered VM
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'pomodoro-drop'
            displayName: 'Download Build Artifacts'
          # Clean and drop files on your local Windows Server C:\ drive
          - task: CopyFiles@2
            displayName: 'Copy Files to Target Directory'
            inputs:
              SourceFolder: '$(Pipeline.Workspace)/pomodoro-drop'
              Contents: '**'
              TargetFolder: 'C:\Apps\Pomodoro'
              CleanTargetFolder: true

          - task: PowerShell@2
            displayName: 'Verify Deployment'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Pomodoro application successfully deployed to C:\Apps\Pomodoro"
                if (Test-Path "C:\Apps\Pomodoro") {
                    Get-ChildItem -Path C:\Apps\Pomodoro
                } else {
                    Write-Error "Target directory C:\Apps\Pomodoro was not created."
                }