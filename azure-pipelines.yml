trigger:
  - main

pool:
  name: 'Default'

steps:
- - script: |
      echo "System.DefaultWorkingDirectory path is:"
      echo "$(System.DefaultWorkingDirectory)"
      echo "-------------------------------------"
      echo "Files located inside this folder:"
      ls -la $(System.DefaultWorkingDirectory)
    displayName: 'Debug Working Directory'

  - script: |
      python3 -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install Dependencies'

  - script: |
      pytest
    displayName: 'Run Unit Tests'

  - task: ArchiveFiles@2
    displayName: 'Package API Server'
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/pomodoro-api.zip'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Build Artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/pomodoro-api.zip'
      artifact: 'PomodoroApi'
      publishLocation: 'pipeline'